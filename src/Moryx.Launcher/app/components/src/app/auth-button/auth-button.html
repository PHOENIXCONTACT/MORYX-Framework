@if (authurl()) {
  @if (!isLoggedIn()) {
    <button type="button" mat-stroked-button color="primary" (click)="signIn()">
      <span class="material-symbols-outlined">account_circle</span>
      <ng-content select="[sign-in]"></ng-content>
    </button>
  }
  @if (isLoggedIn()) {
    <button type="button" mat-stroked-button color="primary" (click)="signOut()">
      <span class="material-symbols-outlined">logout</span>
      {{ userName() }}
    </button>
  }
}
