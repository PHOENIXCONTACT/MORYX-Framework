<h2 mat-dialog-title>About</h2>

<mat-dialog-content>
  <dl>
    @for (entry of entries(); track entry.label) {
      <div class="entry">
        <dt>{{ entry.label }}</dt>
        <dd>{{ entry.value }}</dd>
      </div>
    }
  </dl>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
