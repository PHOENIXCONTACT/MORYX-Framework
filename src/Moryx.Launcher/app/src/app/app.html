<mat-toolbar>
  <button mat-icon-button aria-label="Menu" (click)="toggleNav()">
    <mat-icon>menu</mat-icon>
  </button>
  <app-moryx-logo></app-moryx-logo>
  <span class="toolbar-spacer"></span>
  <slot name="topRegion"></slot>
  <span class="toolbar-spacer"></span>
  <button mat-icon-button aria-label="More options" [matMenuTriggerFor]="appMenu">
    <mat-icon>more_vert</mat-icon>
  </button>
</mat-toolbar>

<mat-menu #appMenu="matMenu">
  <button mat-menu-item [matMenuTriggerFor]="languageMenu">
    <mat-icon>language</mat-icon>
    <span>Language</span>
  </button>
  <button mat-menu-item [matMenuTriggerFor]="viewsMenu">
    <mat-icon>visibility</mat-icon>
    <span>Views</span>
  </button>
  <mat-divider></mat-divider>

  <mat-divider></mat-divider>
  @for (module of otherModules(); track module.route) {
    <button mat-menu-item title="{{ module.description }}">
      <mat-icon>{{ module.icon }}</mat-icon>
      <span>{{ module.title }}</span>
    </button>
  }
  <mat-divider></mat-divider>

  <button mat-menu-item>
    <mat-icon>info_outline</mat-icon>
    <span>About</span>
  </button>
</mat-menu>

<mat-menu #viewsMenu="matMenu">
  <button mat-menu-item>
    <mat-icon>light_mode</mat-icon>
    <span>Light</span>
  </button>
  <button mat-menu-item>
    <mat-icon>dark_mode</mat-icon>
    <span>Dark</span>
  </button>
  <button mat-menu-item>
    <mat-icon>brightness_auto</mat-icon>
    <span>System</span>
  </button>
</mat-menu>

<mat-menu #languageMenu="matMenu">
  <button mat-menu-item>
    <span>English</span>
  </button>
  <button mat-menu-item>
    <span>Deutsch</span>
  </button>
  <button mat-menu-item>
    <span>Français</span>
  </button>
</mat-menu>

<mat-sidenav-container autosize>
  <mat-sidenav mode="side" opened style="width: fit-content">
    <app-vertical-nav [moduleItems]="userModules()" [collapsed]="navCollapsed()"></app-vertical-nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <slot name="app"></slot>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
<slot name="rightRegion"></slot>
