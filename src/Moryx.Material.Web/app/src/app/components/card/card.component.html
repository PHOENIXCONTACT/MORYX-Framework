<mat-card>
    <mat-card-header>
        <mat-icon mat-card-avatar class="container-icon">
            {{ container().type?.icon ?? 'home' }}
        </mat-icon>
        <mat-card-title>{{ container().material }}</mat-card-title>
        <mat-card-subtitle>{{ container().name }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <section>
            <label>{{ container().quantity+'x '+container().unit }}</label>
            <div class="card-chips">
                <mat-chip-set aria-label="Material links">
                    <mat-chip>State: {{container().state}}</mat-chip>
                    @for (link of links(); track $index)
                    {
                    <mat-chip>{{link}}</mat-chip>
                    }
                </mat-chip-set>
            </div>
        </section>
    </mat-card-content>
    <mat-card-actions>
        <button mat-button (click)="preAdvice()">Advice</button>
        <button mat-button>Change Count</button>
        <button mat-button>Delete</button>
        <button mat-button (click)="link()">Link</button>
    </mat-card-actions>
</mat-card>
