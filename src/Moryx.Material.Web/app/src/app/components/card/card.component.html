<mat-card>
    <mat-card-header>
        <mat-icon mat-card-avatar>
            {{ icon() }}
        </mat-icon>
        <mat-card-title>{{ title() }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <div class="card-content-section">
            <label class="card-product-type">{{ instanceCount()}}</label>
            <div class="card-chips">
                <mat-chip-set aria-label="Material links">
                    @for (link of links(); track $index)
                    {
                    <mat-chip>{{link}}</mat-chip>
                    }
                </mat-chip-set>
            </div>
        </div>
    </mat-card-content>
    <mat-card-actions>
        <button mat-button>Advice</button>
        <button mat-button>Change Count</button>
        <button mat-button>Delete</button>
        <button mat-button>Link</button>
    </mat-card-actions>
</mat-card>
