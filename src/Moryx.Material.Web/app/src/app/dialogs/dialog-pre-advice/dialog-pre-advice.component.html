<h2 mat-dialog-title>
    {{ translationConstants.PRE_ADVICE_DIALOG.TITLE| translate}}
</h2>

<mat-dialog-content class="mat-typography reason-input">
    <section class="reason-input">
        <mat-form-field floatLabel="always" class="full-width" appearance="outline">
            <mat-label>{{ translationConstants.PRE_ADVICE_DIALOG.REASON| translate}}</mat-label>
            <mat-select [(value)]="reason">
                @for (reason of reasons(); track $index)
                {
                <mat-option [value]="reason">{{ reason }}</mat-option>
                }
            </mat-select>
        </mat-form-field>
        @if (data.autoGenerated)
        {
        <mat-form-field floatLabel="always" class="full-width" appearance="outline">
            <mat-label>Container Identity</mat-label>
            <input matInput type="text" />
        </mat-form-field>
        <mat-form-field floatLabel="always" class="full-width" appearance="outline">
            <mat-label>Amount to Advice</mat-label>
            <input matInput type="number" placeholder="0" />
        </mat-form-field>
        }
    </section>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button mat-dialog-close color="primary" type="button" cdkFocusInitial class="transform-to-uppercase">
        {{ translationConstants.PRE_ADVICE_DIALOG.CANCEL| translate}}
    </button>
    <button mat-button class="transform-to-uppercase" type="button" [disabled]="!reason()" (click)="advice()">
        {{ translationConstants.PRE_ADVICE_DIALOG.DONE| translate}}
    </button>
</mat-dialog-actions>
