<h2 mat-dialog-title>Delete Container?</h2>
<mat-dialog-content>This will delete the current container and cannot be undone.</mat-dialog-content>
<mat-dialog-actions>
  <button matButton [mat-dialog-close]="false" type="button" cdkFocusInitial>Cancel</button>
  <button matButton [mat-dialog-close]="true" type="button" >Delete</button>
</mat-dialog-actions>
