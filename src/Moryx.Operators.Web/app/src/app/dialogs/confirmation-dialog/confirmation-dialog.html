<h2 mat-dialog-title>{{ data.dialogTitle }}</h2>
<mat-dialog-content>{{ data.dialogMessage }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" cdkFocusInitial (click)="onNoClick()">
    {{ TranslationConstants.CONFIRMATION_DIALOG.NO| translate }}
  </button>
  <button mat-flat-button type="button" (click)="onYesclick()">
    {{ TranslationConstants.CONFIRMATION_DIALOG.YES| translate }}
  </button>
</mat-dialog-actions>
