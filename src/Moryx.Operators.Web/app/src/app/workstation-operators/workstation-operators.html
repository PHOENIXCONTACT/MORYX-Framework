<div class="workstation-container">
  <div class="fab-container">
    <div class="fab-stack">
      <div>
        <a
          mat-mini-fab
          [matTooltip]="TranslationConstants.OPERATORS_MANAGEMENT.MANAGE_OPERATORS | translate"
          matTooltipPosition="left"
          routerLink="/management"
          class="management-button">
          <mat-icon>manage_accounts</mat-icon>
        </a>
      </div>
      <button mat-fab (click)="addOperator()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </div>
  @if (!workstations().length) {
    <empty-state
      [header]="TranslationConstants.WORKSTATION_OPERATORS.EMPTY_TITLE | translate"
      [message]="TranslationConstants.WORKSTATION_OPERATORS.EMPTY_MESSAGE | translate">
    </empty-state>
  }

  @if (!isCardExpanded()) {
    <div class="station-grid">
      @for (station of workstations(); track station) {
        <mat-card class="station-card">
          <mat-card-header>
            <mat-card-title>{{ station.data.name }}</mat-card-title>
            <button
              mat-icon-button
              aria-label="expand station card"
              [matTooltip]="TranslationConstants.WORKSTATION_OPERATORS.EXPAND | translate"
              (click)="toggleWorkstationCard(station)">
              <mat-icon>fullscreen</mat-icon>
            </button>
          </mat-card-header>
          <mat-card-content class="station-card-body" role="main">
            <app-operators [workstation]="station" mainContainerStyle=""></app-operators>
          </mat-card-content>
        </mat-card>
      }
    </div>
  } @else {
    <mat-toolbar>
      <button
        mat-icon-button
        aria-label="Go back"
        [matTooltip]="TranslationConstants.WORKSTATION_OPERATORS.GO_BACK | translate"
        (click)="toggleWorkstationCard(workstationTogglingState()?.station)">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <span>{{ workstationTogglingState()?.station?.data?.name }}</span>
      <span class="spacer"></span>
      <span>1</span>
      <mat-icon>person</mat-icon>
    </mat-toolbar>
    <div class="expanded-grid">
      <app-operators [workstation]="workstationTogglingState()?.station!" mainContainerStyle="">
      </app-operators>
    </div>
  }
</div>
