<h1 mat-dialog-title>{{ data.title }}</h1>
<div mat-dialog-content>
  {{ data.message }}
</div>
<div mat-dialog-actions align="end">
  <button mat-button type="button" cdkFocusInitial mat-dialog-close>
    {{ TranslationConstants.CONFIRM_DIALOG.CANCEL | translate }}
  </button>
  <button mat-flat-button type="button" [mat-dialog-close]="true">
    {{ TranslationConstants.CONFIRM_DIALOG.CONFIRM | translate }}
  </button>
</div>
