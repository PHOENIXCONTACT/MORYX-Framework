<h2 mat-dialog-title>{{ TranslationConstants.DELETE_DIALOG.TITLE | translate }}</h2>
<mat-dialog-content class="mat-typography">
  {{ data.deleteMessage }}
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close cdkFocusInitial>
    {{ TranslationConstants.DELETE_DIALOG.CANCEL | translate }}
  </button>
  <button mat-flat-button type="button" [mat-dialog-close]="true">
    {{ TranslationConstants.DELETE_DIALOG.DELETE | translate }}
  </button>
</mat-dialog-actions>
