components:
  schemas:
    ActivityChangedModel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        resourceId:
          type: integer
          format: int64
        classification:
          $ref: '#/components/schemas/ActivityClassification'
        orderReferenceModel:
          $ref: '#/components/schemas/OrderReferenceModel'
    ActivityClassification:
      enum:
        - Unknown
        - Production
        - Setup
        - Maintenance
        - Preparation
      type: string
      description: "Defines different classifications of activities. A resource will define accepted classifications\r\nin the published ReadyToWork. An activity declares its classification which is compared\r\nto the accepted classification within the kernel. While a ReadyToWork can accept multiple\r\nclassifications (by combining flags), an activity has only one classification."
    ActivityResourceModel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
    AdviceContext:
      type: object
      properties:
        advicedAmount:
          type: integer
          description: Amount which are already adviced
          format: int32
      description: Context for a new advice with all necessary information
    AdviceModel:
      type: object
      properties:
        toteBoxNumber:
          type: string
          nullable: true
        amount:
          type: integer
          format: int32
        partId:
          type: integer
          format: int64
          nullable: true
    ApiError:
      required:
        - errorCode
        - message
      type: object
      properties:
        errorCode:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        exception:
          $ref: '#/components/schemas/Exception'
    'ApiResponseOfProcessHolderGroupModel[]':
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProcessHolderGroupModel'
          nullable: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
          nullable: true
        succeeded:
          type: boolean
        timestamp:
          type: string
          format: date-time
    ApplicationInformationResponse:
      type: object
      properties:
        assemblyProduct:
          type: string
          nullable: true
        assemblyVersion:
          type: string
          nullable: true
        assemblyInformationalVersion:
          type: string
          nullable: true
        assemblyDescription:
          type: string
          nullable: true
        assemblyCompanyName:
          type: string
          nullable: true
        assemblyTitle:
          type: string
          nullable: true
        assemblyConfiguration:
          type: string
          nullable: true
        targetFramework:
          type: string
          nullable: true
        assemblyCopyright:
          type: string
          nullable: true
        assemblyTrademark:
          type: string
          nullable: true
    AssemblyModel:
      type: object
      properties:
        name:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        fileVersion:
          type: string
          nullable: true
        informationalVersion:
          type: string
          nullable: true
    AssignableOperator:
      required:
        - identifier
      type: object
      properties:
        signedIn:
          type: boolean
        assignedResources:
          type: array
          items:
            $ref: '#/components/schemas/IOperatorAssignable'
        identifier:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        pseudonym:
          type: string
          nullable: true
    AssignedDays:
      enum:
        - All
        - First
        - Second
        - Third
        - Fourth
        - Fifth
        - Sixth
        - Seventh
        - Eighth
        - Ninth
        - Tenth
        - Eleventh
        - Twelfth
        - Thirteenth
        - Fourteenth
        - Fifteenth
        - Sixteenth
        - Seventeenth
        - Eighteenth
        - Nineteenth
        - Twentieth
        - TwentyFirst
        - TwentySecond
        - TwentyThird
        - TwentyFourth
        - TwentyFifth
        - TwentySixth
        - TwentySeventh
        - TwentyEighth
        - TwentyNinth
        - Thirtieth
        - ThirtyFirst
      type: string
    AttendableResourceModel:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
          nullable: true
        requiredSkills:
          type: array
          items:
            type: string
          nullable: true
    BeginContext:
      type: object
      properties:
        residualAmount:
          type: integer
          description: Residual amount of the operation
          format: int32
        partialAmount:
          type: integer
          description: Current target amount of the operation
          format: int32
        minimalTargetAmount:
          type: integer
          description: Provides the minimum value that can be set for the target amount when adjusting the operation.
          format: int32
        canBegin:
          type: boolean
          description: Indicator if a begin is possible
        canReduce:
          type: boolean
          description: Indicator if an adjustment of the operation is possible
        restrictions:
          type: array
          items:
            $ref: '#/components/schemas/RestrictionDescription'
          description: Reasons why a begin is not possible
          nullable: true
        successCount:
          type: integer
          description: Current success count of the operation
          format: int32
        scrapCount:
          type: integer
          description: Current failure count of the operation
          format: int32
      description: Context information to begin an operation production
    BeginModel:
      type: object
      properties:
        amount:
          type: integer
          format: int32
        userId:
          type: string
          nullable: true
    Category:
      enum:
        - ProcessHolderGroup
        - ParentResource
      type: string
    CellLocationModel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        positionX:
          type: number
          format: double
        positionY:
          type: number
          format: double
    CellPropertySettings:
      type: object
      properties:
        valueUnit:
          type: string
          nullable: true
        iconName:
          type: string
          nullable: true
        isDisplayed:
          type: boolean
        currentValue: { }
        displayName:
          type: string
          nullable: true
    CellSettingsModel:
      type: object
      properties:
        image:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
    CellState:
      enum:
        - Idle
        - Requested
        - Running
        - NotReadyToWork
      type: string
    CellStateChangedModel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        state:
          $ref: '#/components/schemas/CellState'
    Config:
      type: object
      properties:
        root:
          $ref: '#/components/schemas/Entry'
    ConfigUpdateMode:
      enum:
        - OnlySave
        - SaveAndReincarnate
        - UpdateLiveAndSave
      type: string
    ConfirmationType:
      enum:
        - Partial
        - Final
      type: string
      description: Confirmation type while reporting amounts of an operation
    ContentDescriptorModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantDescriptor'
          nullable: true
        master:
          $ref: '#/components/schemas/VariantDescriptor'
    DatabaseConfigModel:
      type: object
      properties:
        configuratorType:
          type: string
          nullable: true
        connectionString:
          type: string
          nullable: true
        properties:
          $ref: '#/components/schemas/Entry'
    DatabaseMigrationSummary:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/MigrationResult'
        errors:
          type: array
          items:
            type: string
          description: 'Reason, in case an error occured during migration'
          nullable: true
        executedMigrations:
          type: array
          items:
            type: string
          description: All updates that were executed
          nullable: true
      description: Result object created from running a database update
    DatabasesResponse:
      type: object
      properties:
        databases:
          type: array
          items:
            $ref: '#/components/schemas/DataModel'
          nullable: true
        configurators:
          type: array
          items:
            $ref: '#/components/schemas/ModelConfiguratorModel'
          nullable: true
    DataModel:
      type: object
      properties:
        targetModel:
          type: string
          nullable: true
        config:
          $ref: '#/components/schemas/DatabaseConfigModel'
        possibleConfigurators:
          type: array
          items:
            type: string
          nullable: true
        setups:
          type: array
          items:
            $ref: '#/components/schemas/SetupModel'
          nullable: true
        availableMigrations:
          type: array
          items:
            $ref: '#/components/schemas/DbMigrationsModel'
          nullable: true
        appliedMigrations:
          type: array
          items:
            $ref: '#/components/schemas/DbMigrationsModel'
          nullable: true
    DataType:
      enum:
        - Custom
        - DateTime
        - Date
        - Time
        - Duration
        - PhoneNumber
        - Currency
        - Text
        - Html
        - MultilineText
        - EmailAddress
        - Password
        - Url
        - ImageUrl
        - CreditCard
        - PostalCode
        - Upload
      type: string
    DbMigrationsModel:
      type: object
      properties:
        name:
          type: string
          nullable: true
    DependencyEvaluation:
      type: object
      properties:
        rootModules:
          type: integer
          format: int32
        maxDepth:
          type: integer
          format: int32
        maxDependencies:
          type: integer
          format: int32
        maxDependends:
          type: integer
          format: int32
    DocumentModel:
      type: object
      properties:
        identifier:
          type: string
          nullable: true
        number:
          type: string
          nullable: true
        revision:
          type: integer
          format: int16
        type:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        contentType:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
    Entry:
      type: object
      properties:
        displayName:
          type: string
          description: Name of the item - property name or list item name
          nullable: true
        identifier:
          type: string
          description: Unique identifier - property name or item index
          nullable: true
        description:
          type: string
          description: Description of the entry
          nullable: true
        value:
          $ref: '#/components/schemas/EntryValue'
        validation:
          $ref: '#/components/schemas/EntryValidation'
        subEntries:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
          description: Subentries of this entry - properties or list items
          nullable: true
        prototypes:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
          description: Prototypes that can be used to create subentries
          nullable: true
      description: Model class representing a single property of a config class
    EntryPossible:
      type: object
      properties:
        key:
          type: string
          description: Invariant key of the possible value.
          nullable: true
        displayName:
          type: string
          description: Display name of the possible value.
