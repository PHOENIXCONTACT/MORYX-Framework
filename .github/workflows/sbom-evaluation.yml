name: Generate Product SBOMs

on:
  workflow_dispatch:

  push:
    branches:
      - feature/SBOM-evaluation

jobs:
  generate-sboms:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CycloneDX .NET
        run: |
          dotnet tool install --global CycloneDX

      - name: Install CycloneDX npm
        run: |
          npm install -g @cyclonedx/cyclonedx-npm

      - name: Install CycloneDX CLI
        run: |
          curl -L https://github.com/CycloneDX/cyclonedx-cli/releases/latest/download/cyclonedx-linux-x64 -o cyclonedx
          chmod +x cyclonedx
          mkdir -p "$HOME/.local/bin"
          mv cyclonedx "$HOME/.local/bin/cyclonedx"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify installations
        run: |
          dotnet-CycloneDX --version
          cyclonedx-npm --version
          cyclonedx --version

      - name: Restore solution
        run: |
          dotnet restore

      - name: Generate SBOMs
        shell: bash
        run: |
          mkdir -p sboms

          find . \
            -path "*/bin" -prune -o \
            -path "*/obj" -prune -o \
            -path "*/node_modules" -prune -o \
            -path "*/.git" -prune -o \
            -name "*.csproj" -print0 | while IFS= read -r -d '' project
          do
            echo ""
            echo "Checking project: $project"

            is_packable=$(dotnet msbuild "$project" -getProperty:IsPackable 2>/dev/null | tail -n 1 | tr '[:upper:]' '[:lower:]')

            if [ "$is_packable" != "true" ]; then
              echo "Skipping non-packable project"
              continue
            fi

            project_dir=$(dirname "$project")
            project_name=$(basename "$project" .csproj)

            echo "Generating SBOMs for $project_name"

            output_dir="sboms/$project_name"
            mkdir -p "$output_dir"

            #
            # .NET SBOM
            #
            dotnet-CycloneDX "$project" \
              -F Json \
              -ipr \
              -o "$output_dir" \
              -fn "bom-dotnet.json"

            #
            # npm SBOMs (optional)
            #
            find "$project_dir" \
              -path "*/bin" -prune -o \
              -path "*/obj" -prune -o \
              -path "*/node_modules" -prune -o \
              -path "*/.git" -prune -o \
              -name "package.json" -print0 | while IFS= read -r -d '' package_json
            do
              npm_dir=$(dirname "$package_json")
              echo "Found package.json for $project_name in $npm_dir"

              if [ ! -f "$npm_dir/package-lock.json" ]; then
                echo "Skipping npm SBOM for $project_name because package-lock.json is missing in $npm_dir"
                continue
              fi

              npm_relative_dir=${npm_dir#"$project_dir"}
              npm_relative_dir=${npm_relative_dir#/}

              if [ -z "$npm_relative_dir" ]; then
                npm_bom_name="bom-npm.json"
              else
                npm_bom_suffix=${npm_relative_dir//\//-}
                npm_bom_suffix=${npm_bom_suffix//[^[:alnum:]._-]/-}
                npm_bom_name="bom-npm-$npm_bom_suffix.json"
              fi

              pushd "$npm_dir"

              npm ci

              cyclonedx-npm \
                --output-format JSON \
                --ignore-npm-errors \
                --output-file "$(pwd)/$npm_bom_name"

              popd

              mv "$npm_dir/$npm_bom_name" \
                 "$output_dir/$npm_bom_name"
            done
          done

      - name: Merge product SBOMs
        shell: bash
        run: |
          product_version=$(tr -d '[:space:]' < VERSION)

          if [ -z "$product_version" ]; then
            echo "VERSION file is empty"
            exit 1
          fi

          find sboms -mindepth 1 -maxdepth 1 -type d -print0 | while IFS= read -r -d '' product_dir
          do
            product_name=$(basename "$product_dir")
            echo "Merging SBOMs for $product_name"

            mapfile -d '' bom_files < <(
              find "$product_dir" \
                -maxdepth 1 \
                -type f \
                -name "bom-*.json" \
                ! -name "bom-product.json" \
                -print0
            )

            if [ "${#bom_files[@]}" -eq 0 ]; then
              echo "No SBOM files found for $product_name"
              continue
            fi

            if [ "${#bom_files[@]}" -eq 1 ]; then
              echo "Only one SBOM found for $product_name, copying it as bom-product.json"
              cp "${bom_files[0]}" "$product_dir/bom-product.json"
              continue
            fi

            echo "Merging ${#bom_files[@]} SBOM files for $product_name into bom-product.json"

            cyclonedx merge \
              --input-files "${bom_files[@]}" \
              --input-format json \
              --output-format json \
              --output-file "$product_dir/bom-product.json" \
              --hierarchical \
              --name "$product_name" \
              --version "$product_version"
          done

      - name: Merge all product SBOMs
        shell: bash
        run: |
          product_version=$(tr -d '[:space:]' < VERSION)

          if [ -z "$product_version" ]; then
            echo "VERSION file is empty"
            exit 1
          fi

          mapfile -d '' product_boms < <(
            find sboms \
              -mindepth 2 \
              -maxdepth 2 \
              -type f \
              -name "bom-product.json" \
              -print0
          )

          if [ "${#product_boms[@]}" -eq 0 ]; then
            echo "No product SBOMs found for global merge"
            exit 1
          fi

          if [ "${#product_boms[@]}" -eq 1 ]; then
            echo "Only one product SBOM found, copying it as sboms/bom-all-products.json"
            cp "${product_boms[0]}" "sboms/bom-all-products.json"
            exit 0
          fi

          echo "Merging ${#product_boms[@]} product SBOMs into sboms/bom-all-products.json"

          cyclonedx merge \
            --input-files "${product_boms[@]}" \
            --input-format json \
            --output-format json \
            --output-file "sboms/bom-all-products.json" \
            --hierarchical \
            --name "MORYX" \
            --version "$product_version"

      - name: Show generated SBOMs
        run: |
          find sboms -type f

      - name: Validate SBOMs
        shell: bash
        run: |
          mapfile -d '' sbom_files < <(find sboms -type f -name "*.json" -print0)

          if [ "${#sbom_files[@]}" -eq 0 ]; then
            echo "No SBOM files found for validation"
            exit 1
          fi

          echo "Found ${#sbom_files[@]} SBOM files for validation"

          for sbom in "${sbom_files[@]}"; do
            echo "Validating $sbom"

            spec_version=$(jq -r '.specVersion // empty' "$sbom")

            if [ -z "$spec_version" ]; then
              echo "Missing CycloneDX specVersion in $sbom"
              exit 1
            fi

            cyclonedx validate \
              --input-file "$sbom" \
              --input-format json \
              --input-version "v${spec_version//./_}" \
              --fail-on-errors
          done

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: product-sboms
          path: sboms/
          if-no-files-found: warn