name: SBOM Evaluation

on:
  workflow_dispatch:

  push:
    branches:
      - feature/SBOM-evaluation

jobs:
  frontend-sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install CycloneDX NPM
        run: npm install -g @cyclonedx/cyclonedx-npm

      - name: Verify installation
        run: cyclonedx-npm --version

      - name: Create output directory
        run: mkdir -p sboms
        
      - name: Generate frontend SBOMs
        shell: bash
        run: |
          find . -name package-lock.json | while read lockfile
          do
            dir=$(dirname "$lockfile")
            project=$(basename "$(dirname "$dir"))

            echo "======================================="
            echo "Processing $project"
            echo "Directory: $dir"
            echo "======================================="

            cd "$dir"

            echo "Installing dependencies..."
            npm ci

            echo "Generating SBOM..."
            cyclonedx-npm --output-file "/tmp/${project}.json"

            cd "$GITHUB_WORKSPACE"

            cp "/tmp/${project}.json" "sboms/${project}-bom.json"
          done
          
      - name: Show generated SBOMs
        run: |
          ls -lah sboms

      - name: Upload frontend SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sboms
          path: sboms/*.json
